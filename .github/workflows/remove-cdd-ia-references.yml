name: Remove CDD-IA references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove framework references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/remove-cdd-ia-references.yml')
          if workflow.exists():
              workflow.unlink()

          replacements = {
              'Propostes de llibre d’estil · CDD-IA': 'Propostes de llibre d’estil',
              '3 propostes de llibre d’estil · CDD-IA': '3 propostes de llibre d’estil',
              'Llibre d’estil · Pilotatge CDD-IA': 'Llibre d’estil · Pilotatge',
              'Pilotatge CDD-IA · Materials per a implementació al centre': 'Pilotatge · Materials per a implementació al centre',
              'pilotatge dels mòduls 1 i 2 de CDD-IA.': 'pilotatge dels mòduls 1 i 2.',
          }

          text_suffixes = {'.md', '.html', '.css', '.js', '.json', '.txt', '.yml', '.yaml'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'CDD[\-‑–— ]?IA', '', text, flags=re.IGNORECASE)
              text = re.sub(r'Competència\s+Digital\s+Docent\s*[-–—:]?\s*IA', '', text, flags=re.IGNORECASE)
              text = text.replace(' ·  · ', ' · ')
              text = re.sub(r'[ \t]+\n', '\n', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          leftovers = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'CDD[\-‑–— ]?IA|Competència\s+Digital\s+Docent\s*[-–—:]?\s*IA', text, flags=re.IGNORECASE):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('References remain in: ' + ', '.join(leftovers))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove CDD-IA references"
            git push
          fi
